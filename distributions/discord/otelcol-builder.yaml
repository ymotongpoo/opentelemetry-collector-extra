dist:
  module: github.com/ymotongpoo/opentelemetry-collector-extra/distributions/discord
  name: discord-otelcol
  description: Discord metrics collector for Grafana Alloy
  output_path: ./build/discord
  version: 0.1.1

receivers:
  - gomod: github.com/ymotongpoo/opentelemetry-collector-extra/receiver/discordreceiver v0.0.0
    path: ./receiver/discordreceiver

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.163.0
