# All custom components are compiled in. Only configured components run.
# Copy optional receiver snippets from /usr/share/otelcol-extra/examples/ to conf.d/.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4319
exporters:
  otlp_http/alloy:
    endpoint: http://127.0.0.1:4318
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/alloy]
