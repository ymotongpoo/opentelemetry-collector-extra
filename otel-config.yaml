receivers:
  discord:
    token: ${env:DISCORD_BOT_TOKEN}
    buffer_interval: 30s
    include_bots: false
  slack:
    bot_token: ${env:SLACK_BOT_TOKEN}
    app_token: ${env:SLACK_APP_TOKEN}
    buffer_interval: 30s
    include_bots: false

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [discord, slack]
      exporters: [debug]
