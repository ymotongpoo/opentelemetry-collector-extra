name: Discord Debian packages

on:
  push:
    branches: [main]
    tags: ['discord-otelcol/v*']
    paths:
      - '.github/workflows/discord-packages.yaml'
      - 'distributions/discord/**'
      - 'packaging/debian/**'
      - 'receiver/discordreceiver/**'
      - 'scripts/build-discord-*.sh'
      - 'scripts/test-discord-deb.sh'
  pull_request:
    paths:
      - '.github/workflows/discord-packages.yaml'
      - 'distributions/discord/**'
      - 'packaging/debian/**'
      - 'receiver/discordreceiver/**'
      - 'scripts/build-discord-*.sh'
      - 'scripts/test-discord-deb.sh'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/discordreceiver/go.mod
          cache-dependency-path: receiver/discordreceiver/go.sum
      - name: Select the package version
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/discord-otelcol/v* ]]; then
            version="${GITHUB_REF_NAME#discord-otelcol/v}"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: go test -race -timeout=5m ./...
        working-directory: receiver/discordreceiver
      - name: Build the Debian package
        run: make discord-deb VERSION="$PACKAGE_VERSION" ARCH="${{ matrix.arch }}"
      - name: Validate and install the amd64 package
        if: matrix.arch == 'amd64'
        run: ./scripts/test-discord-deb.sh "dist/discord-otelcol_${PACKAGE_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: discord-otelcol-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/discord-otelcol/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: discord-otelcol-*
          path: dist
          merge-multiple: true
      - name: Publish the Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          sha256sum -- *.deb > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Discord Collector ${GITHUB_REF_NAME#discord-otelcol/v}" \
            --generate-notes --latest ./*.deb SHA256SUMS
