steps:
  - name: golang:1.27
    entrypoint: make
    args: [build, validate]
    id: BUILD_COLLECTOR
  - name: golang:1.27
    entrypoint: go
    args: [build, -o, otelcol-custom-macos, .]
    env: [GOOS=darwin, GOARCH=arm64, CGO_ENABLED=0]
    id: BUILD_COLLECTOR_MACOS
    waitFor: [BUILD_COLLECTOR]
artifacts:
  objects:
    location: gs://yoshifumi-artifacts/
    paths:
      - otelcol-custom
      - otelcol-custom-macos
